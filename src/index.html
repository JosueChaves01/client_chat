<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Chat</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="app-container">
        <!-- Channels Panel (Left Sidebar) -->
        <aside class="channels-panel">
            <header class="channels-header">Channels</header>
            <ul class="channel-list">
                <li class="channel-item active"># general</li>
                <li class="channel-item"># voice-chat</li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div id="videoGrid">
                <video id="localVideo" autoplay playsinline muted></video>
            </div>
            <div class="chat-container">
                <ul id="messages"></ul>
                <div class="message-input-container">
                    <input id="messageInput" type="text" placeholder="Message #general">
                </div>
            </div>
            <!-- Media Controls -->
            <div class="media-controls">
                <button id="toggle-mic" class="control-button">Mute</button>
                <button id="toggle-cam" class="control-button">Cam Off</button>
                <button id="change-name" class="control-button">Change Name</button>
            </div>
        </main>

        <!-- Users Panel (Right Sidebar) -->
        <aside class="users-panel">
            <!-- Users list will be rendered here -->
        </aside>
    </div>

    <script type="module" src="script.js"></script>
</body>

</html>
